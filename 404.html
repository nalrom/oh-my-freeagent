<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — oh-my-freeagent</title>
<style>
:root {
  --bg: #0a0a1a;
  --bg-card: #12122e;
  --gradient-1: #7c3aed;
  --gradient-2: #06b6d4;
  --accent: #22d3ee;
  --text: #e2e8f0;
  --text-muted: #94a3b8;
  --text-dim: #64748b;
  --border: #1e293b;
  --font-serif: Georgia, 'Times New Roman', serif;
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'Courier New', Courier, monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{
  font-family:var(--font-sans);
  background:var(--bg);
  color:var(--text);
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:24px;
  position:relative;
  overflow:hidden;
}
body::before{
  content:'';
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  opacity:0.03;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-repeat:repeat;
  background-size:256px 256px;
}
.orb{
  position:fixed;
  border-radius:50%;
  filter:blur(80px);
  pointer-events:none;
  z-index:0;
}
.orb--1{
  width:400px;height:400px;
  background:rgba(124,58,237,0.1);
  top:-100px;right:-100px;
  animation:drift 12s ease-in-out infinite alternate;
}
.orb--2{
  width:300px;height:300px;
  background:rgba(6,182,212,0.07);
  bottom:-80px;left:-80px;
  animation:drift 15s ease-in-out infinite alternate-reverse;
}
@keyframes drift{
  0%{transform:translate(0,0) scale(1)}
  100%{transform:translate(50px,30px) scale(1.1)}
}
.content{position:relative;z-index:1;max-width:540px}
.code404{
  font-family:var(--font-serif);
  font-size:clamp(6rem,20vw,12rem);
  font-weight:900;
  line-height:1;
  background:linear-gradient(135deg,var(--gradient-1),var(--gradient-2));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  margin-bottom:8px;
  animation:pulse 3s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{filter:drop-shadow(0 0 30px rgba(124,58,237,0.2))}
  50%{filter:drop-shadow(0 0 60px rgba(124,58,237,0.4))}
}
h1{
  font-family:var(--font-serif);
  font-size:clamp(1.4rem,3vw,2rem);
  margin-bottom:16px;
  color:var(--text);
}
p{
  color:var(--text-muted);
  font-size:1.05rem;
  margin-bottom:32px;
  line-height:1.8;
}
.links{
  display:flex;
  gap:16px;
  justify-content:center;
  flex-wrap:wrap;
}
.btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:14px 32px;
  border-radius:999px;
  font-size:0.95rem;
  font-weight:600;
  text-decoration:none;
  transition:all 0.3s ease;
  font-family:var(--font-sans);
}
.btn-primary{
  background:linear-gradient(135deg,var(--gradient-1),var(--gradient-2));
  color:#fff;
  box-shadow:0 4px 24px rgba(124,58,237,0.3);
}
.btn-primary:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 32px rgba(124,58,237,0.45);
}
.btn-secondary{
  background:transparent;
  color:var(--text);
  border:1px solid var(--border);
}
.btn-secondary:hover{
  border-color:var(--accent);
  background:rgba(34,211,238,0.06);
  transform:translateY(-2px);
}
.terminal{
  display:inline-block;
  margin-top:40px;
  padding:12px 24px;
  background:rgba(13,13,34,0.8);
  border:1px solid #1e293b;
  border-radius:8px;
  font-family:var(--font-mono);
  font-size:0.85rem;
  color:var(--text-dim);
}
.terminal span{
  color:var(--accent);
}
</style>
</head>
<body>
  <div class="orb orb--1"></div>
  <div class="orb orb--2"></div>
  <div class="content">
    <div class="code404">404</div>
    <h1>Page Not Found</h1>
    <p>This route doesn't exist — maybe it never did. The good news is our free AI agents are still running.</p>
    <div class="links">
      <a href="index.html" class="btn btn-primary">← Back Home</a>
      <a href="oh-my-freeagent.json" class="btn btn-secondary">Download Config</a>
    </div>
    <div class="terminal">
      <span>$</span> find /free/ai — no results. But the agents are waiting.
    </div>
  </div>
</body>
</html>
